<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usimamizi | Waaminio Runzewe</title><style>
:root{--p:#32105f;--gold:#d6ad55;--bg:#f7f4fa;--line:#e5ddeb;--muted:#766d80}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,sans-serif;color:#241b2d}.top{background:var(--p);color:white;padding:20px}.wrap{max-width:900px;margin:auto;padding:22px 16px 60px}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;margin:15px 0}.hidden{display:none!important}label{display:block;font-weight:650;margin:14px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #d9d0e1;border-radius:9px;font:inherit}textarea{min-height:145px;resize:vertical}.btn{border:0;border-radius:9px;background:var(--p);color:white;padding:12px 17px;font-weight:700;margin-top:12px;cursor:pointer}.secondary{background:#eee8f4;color:var(--p)}.danger{background:#a32942}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}.muted{color:var(--muted);font-size:13px}.notice{padding:12px;border-radius:9px;background:#f3edf9;margin:12px 0;white-space:pre-wrap}.row{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="wrap" style="padding:0 16px"><b>WAAMINIO RUNZEWE</b><div style="opacity:.8">Jopo la usimamizi</div></div></header><main class="wrap"><section id="login" class="panel"><h2>Ingia kama msimamizi</h2><p class="muted">Tumia nenosiri uliloweka kwenye Netlify environment variables.</p><label>Nenosiri</label><input id="password" type="password" autocomplete="current-password"><button class="btn" id="loginBtn">Ingia</button><div id="loginMsg" class="notice hidden"></div></section>
<section id="dashboard" class="hidden"><div class="row"><h2 style="flex:1">Masomo yako</h2><button class="btn secondary" id="logoutBtn">Toka</button><a class="btn secondary" href="/" style="text-decoration:none">Tazama website</a></div><div id="msg" class="notice hidden"></div>
<section class="panel"><h3 id="formTitle">Ongeza somo jipya</h3><input type="hidden" id="editId"><label>Kichwa cha somo *</label><input id="title" maxlength="160" placeholder="Mfano: Mafundisho kuhusu..." required><label>Aina ya maudhui</label><select id="type"><option>Somo</option><option>Mafundisho</option><option>Mahubiri</option><option>Nyimbo</option><option>Taarifa</option></select><label>Muhtasari mfupi</label><textarea id="summary" style="min-height:75px" maxlength="500" placeholder="Maelezo mafupi yatakayoonekana kwenye ukurasa wa mwanzo"></textarea><label>Maandishi ya somo</label><textarea id="text" placeholder="Andika au bandika somo lako hapa..."></textarea><label>HTML ya somo (hiari)</label><textarea id="html" placeholder="Bandika HTML yako hapa. Itafunguliwa ndani ya eneo lililotengwa."></textarea><div class="grid"><div><label>Pakia sauti au video (faili ndogo)</label><input type="file" id="media" accept="audio/*,video/mp4,video/webm,video/ogg"><p class="muted">Kwa sasa faili la moja kwa moja lisizidi MB 4. Video kubwa weka YouTube URL.</p></div><div><label>Link ya video (YouTube n.k.)</label><input id="videoUrl" type="url" placeholder="https://youtu.be/..."></div></div><div class="row"><button class="btn" id="saveBtn">Hifadhi na chapisha</button><button class="btn secondary" id="resetBtn">Futa fomu</button></div></section>
<section class="panel"><h3>Machapisho yaliyopo</h3><div id="posts">Inapakia...</div></section></section></main>
<script>
const API='/.netlify/functions/api';let token='';const $=id=>document.getElementById(id);function message(id,t){$(id).textContent=t;$(id).classList.remove('hidden')}async function req(action,data={},method='POST'){const r=await fetch(API+'?action='+action,{method,headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:method==='GET'?undefined:JSON.stringify(data)});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'Hitilafu imetokea');return j}
async function check(){try{await req('check',{},'GET');$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');loadPosts()}catch{}}
$('loginBtn').onclick=async()=>{try{const r=await req('login',{password:$('password').value});token=r.token;sessionStorage.setItem('wr_token',token);$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');loadPosts()}catch(e){message('loginMsg',e.message)}};
$('logoutBtn').onclick=async()=>{try{await req('logout')}catch{}token='';sessionStorage.removeItem('wr_token');$('dashboard').classList.add('hidden');$('login').classList.remove('hidden')};
async function loadPosts(){try{const a=await req('admin-list',{},'GET');$('posts').innerHTML=a.map(x=>`<div class="item"><b>${esc(x.title)}</b><div class="muted">${esc(x.type)} · ${x.published?'Imechapishwa':'Rasimu'}</div><div class="row"><button class="btn secondary" onclick="editPost('${x.id}')">Hariri</button><button class="btn secondary" onclick="togglePost('${x.id}',${!x.published})">${x.published?'Ficha':'Chapisha'}</button><button class="btn danger" onclick="deletePost('${x.id}')">Futa</button></div></div>`).join('')||'<p class="muted">Bado hakuna machapisho.</p>'}catch(e){message('msg',e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function editPost(id){try{const x=await req('get-admin',{id},'GET');$('editId').value=x.id;$('title').value=x.title;$('type').value=x.type;$('summary').value=x.summary||'';$('text').value=x.text||'';$('html').value=x.html||'';$('videoUrl').value=x.videoUrl||'';$('formTitle').textContent='Hariri somo';window.scrollTo({top:0,behavior:'smooth'})}catch(e){message('msg',e.message)}}
async function togglePost(id,published){try{await req('publish',{id,published});loadPosts()}catch(e){message('msg',e.message)}}
async function deletePost(id){if(!confirm('Una uhakika unataka kufuta chapisho hili?'))return;try{await req('delete',{id});loadPosts()}catch(e){message('msg',e.message)}}
$('saveBtn').onclick=async()=>{try{const title=$('title').value.trim();if(!title)throw Error('Weka kichwa cha somo.');let file=null;const f=$('media').files[0];if(f){if(f.size>4*1024*1024)throw Error('Faili limezidi MB 4. Tumia link ya YouTube kwa video kubwa.');file={name:f.name,type:f.type||'application/octet-stream',data:await toBase64(f)}}const data={id:$('editId').value||undefined,title,type:$('type').value,summary:$('summary').value,text:$('text').value,html:$('html').value,videoUrl:$('videoUrl').value.trim(),file};await req('save',data);message('msg','Chapisho limehifadhiwa kama rasimu. Bonyeza Chapisha kwenye orodha ili lionekane kwa wageni.');reset();loadPosts()}catch(e){message('msg',e.message)}};
function toBase64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)})}
function reset(){$('editId').value='';['title','summary','text','html','videoUrl'].forEach(x=>$(x).value='');$('media').value='';$('formTitle').textContent='Ongeza somo jipya'}$('resetBtn').onclick=reset;
token=sessionStorage.getItem('wr_token')||'';check();
</script></body></html>
