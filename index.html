<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#32105f"><title>Waaminio Runzewe</title>
<style>
:root{--purple:#32105f;--gold:#d6ad55;--ink:#241b2d;--muted:#746b7c;--paper:#faf8fc;--line:#e9e2ef}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.hero{background:linear-gradient(135deg,#241044,#56318a);color:white;padding:34px 18px 42px}.wrap{max-width:960px;margin:auto}.brand{font-size:13px;letter-spacing:.16em;color:#e8d7ff;text-transform:uppercase}.hero h1{font-size:clamp(30px,6vw,48px);margin:12px 0 8px}.hero p{color:#e8ddf3;margin:0;line-height:1.6}.searchbar{display:flex;gap:8px;margin-top:24px}.searchbar input{flex:1;min-width:0;padding:14px;border:0;border-radius:12px;font-size:16px}.searchbar button,.btn{border:0;border-radius:10px;background:var(--gold);color:#241b2d;font-weight:700;padding:12px 16px;cursor:pointer}.main{padding:28px 18px 60px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.sectionhead h2{font-size:22px}.count{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:0 5px 18px #28133b08}.tag{display:inline-block;background:#f0eafa;color:#57318a;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:700}.card h3{margin:12px 0 8px;font-size:19px}.card p{color:var(--muted);line-height:1.55;margin:0 0 14px;white-space:pre-wrap}.open{color:#57318a;text-decoration:none;font-weight:700}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed #cfc3da;border-radius:15px}.footer{text-align:center;color:var(--muted);font-size:13px;padding:25px;border-top:1px solid var(--line)}.reader{max-width:780px;margin:25px auto;background:white;padding:clamp(18px,4vw,38px);border:1px solid var(--line);border-radius:16px}.reader h2{font-size:30px}.reader .body{line-height:1.8;white-space:pre-wrap}.reader iframe{width:100%;min-height:420px;border:1px solid var(--line);border-radius:12px}.media{width:100%;margin:18px 0;border-radius:12px}.back{display:inline-block;margin:8px 0 18px;color:#57318a;text-decoration:none;font-weight:700}@media(max-width:540px){.searchbar{flex-direction:column}.searchbar button{width:100%}.reader iframe{min-height:320px}}
</style></head>
<body><header class="hero"><div class="wrap"><div class="brand">Jukwaa la mafundisho</div><h1>Waaminio Runzewe</h1><p>Masomo, mafundisho, nyimbo na video kwa ajili ya kujifunza.</p><form class="searchbar" id="searchForm"><input id="search" placeholder="Tafuta somo..." aria-label="Tafuta somo"><button>Tafuta</button></form></div></header>
<main class="main wrap" id="main"><div class="sectionhead"><h2>Masomo na mafundisho</h2><span class="count" id="count">Inapakia...</span></div><div class="cards" id="cards"></div></main><footer class="footer">© <span id="year"></span> Waaminio Runzewe</footer>
<script>
const API='/.netlify/functions/api';let all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(items){document.getElementById('count').textContent=items.length+' machapisho';const el=document.getElementById('cards');if(!items.length){el.innerHTML='<div class="empty">Bado hakuna somo lililochapishwa. Rudi tena baadaye.</div>';return}el.innerHTML=items.map(x=>`<article class="card"><span class="tag">${esc(x.type||'Somo')}</span><h3>${esc(x.title)}</h3><p>${esc(x.summary||'Fungua ili kusoma zaidi.')}</p><a class="open" href="?somo=${encodeURIComponent(x.id)}">Fungua somo →</a></article>`).join('')}
async function load(){try{const r=await fetch(API+'?action=list');if(!r.ok)throw Error();all=await r.json();render(all)}catch(e){document.getElementById('count').textContent='';document.getElementById('cards').innerHTML='<div class="empty">Imeshindikana kupakia masomo. Hakikisha website imechapishwa Netlify na Functions zimewashwa.</div>'}}
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();const q=document.getElementById('search').value.toLowerCase();render(all.filter(x=>(x.title+' '+(x.summary||'')+' '+(x.type||'')).toLowerCase().includes(q)))});
async function showArticle(id){try{const r=await fetch(API+'?action=get&id='+encodeURIComponent(id));if(!r.ok)throw Error();const x=await r.json();document.getElementById('main').innerHTML=`<article class="reader"><a class="back" href="/">← Rudi kwenye masomo</a><span class="tag">${esc(x.type||'Somo')}</span><h2>${esc(x.title)}</h2><p style="color:#746b7c">${esc(x.date||'')}</p>${x.text?`<div class="body">${esc(x.text)}</div>`:''}${x.html?`<h3>Maudhui ya HTML</h3><iframe sandbox="allow-scripts" referrerpolicy="no-referrer" srcdoc="${esc(x.html)}"></iframe>`:''}${x.mediaUrl?mediaMarkup(x):''}${x.videoUrl?`<p><a class="open" href="${esc(x.videoUrl)}" target="_blank" rel="noopener">Tazama video →</a></p>`:''}</article>`}catch(e){document.getElementById('main').innerHTML='<div class="empty">Somo halijapatikana au halijachapishwa.</div>'}}
function mediaMarkup(x){const u=esc(x.mediaUrl);return x.mediaType?.startsWith('video/')?`<video class="media" controls playsinline src="${u}"></video>`:`<audio class="media" controls src="${u}"></audio>`}
document.getElementById('year').textContent=new Date().getFullYear();const id=new URLSearchParams(location.search).get('somo');if(id)showArticle(id);else load();
</script></body></html>
